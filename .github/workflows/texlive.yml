name: TeXLive Image

on:
  workflow_dispatch:
  schedule:
    # 每月3号的0:37执行 (北京时间+8)
    - cron: "37 0 3 * *"
  push:
    branches: [main]
    paths:
      - "texlive/Dockerfile"
      - "texlive/texlive.profile"

permissions:
  packages: write

env:
  TEST_TAG: texlive:test
  LATEST_TAG: texlive:latest

jobs:
  test:
    # 动态命名任务，方便在 PR 检查面板中区分架构
    name: Test (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}

    strategy:
      # 建议设为 false，防止一个架构失败导致另一个架构的测试被强制取消
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-26.04-arm

    steps:
      - uses: actions/checkout@v7

      - name: Verify Architecture
        run: |
          echo "Current Architecture: $(uname -m)"
          echo "Matrix Target: ${{ matrix.arch }}"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and export to Docker
        uses: docker/build-push-action@v7
        with:
          context: ./texlive
          file: ./texlive/Dockerfile
          load: true
          tags: ${{ env.TEST_TAG }}

      - name: Test
        run: |
          docker run --rm ${{ env.TEST_TAG }} pdflatex --version

  build:
    needs: test
    if: needs.test.result == 'success'
    name: Build and push image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./texlive
          file: ./texlive/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ env.LATEST_TAG }}
