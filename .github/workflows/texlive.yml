name: TeXLive Image

on:
  workflow_dispatch:
  schedule:
    # 每月3号的0:37执行 (北京时间+8)
    - cron: "37 0 3 * *"
  push:
    branches: [main]
    paths:
      - "texlive/Dockerfile"
      - "texlive/texlive.profile"

permissions:
  packages: write

env:
  LATEST_TAG: texlive:latest

jobs:
  test:
    name: Test image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and export to Docker
        uses: docker/build-push-action@v7
        with:
          load: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ env.LATEST_TAG }}

      - name: Test
        run: |
          docker run --rm ghcr.io/${{ github.repository_owner }}/${{ env.LATEST_TAG }} pdflatex --version

  build:
    if: github.steps.test.outcome == 'success'
    name: Build and push image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./texlive
          file: ./texlive/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ env.LATEST_TAG }}
