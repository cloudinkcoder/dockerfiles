name: TeXLive Image

on:
  workflow_dispatch:
  schedule:
    # 每周三的0:37执行 (北京时间+8)
    - cron: "37 0 * * 3"
  push:
    branches: [main]
    paths:
      - "texlive/Dockerfile"
      - "texlive/texlive.profile"

permissions:
  packages: write

env:
  TEST_TAG: texlive:test
  LATEST_TAG: texlive:latest

jobs:
  build-and-test:
    name: Build and Test Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and export to Docker
        uses: docker/build-push-action@v7
        with:
          context: ./texlive
          file: ./texlive/Dockerfile
          outputs: type=docker,dest=${{ runner.temp }}/texlive.tar
          tags: ${{ env.TEST_TAG }}

      - name: Test
        run: |
          docker load --input ${{ runner.temp }}/texlive.tar &&
          docker run --rm ${{ env.TEST_TAG }} pdflatex --version

      - name: Upload image artifact
        uses: actions/upload-artifact@v7
        with:
          name: texlive-image
          path: ${{ runner.temp }}/texlive.tar
          retention-days: 3

  push:
    needs: build-and-test
    if: needs.build-and-test.result == 'success'
    name: Push Image to GitHub Container Registry
    runs-on: ubuntu-latest
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download image artifact
        uses: actions/download-artifact@v8
        with:
          name: texlive-image
          path: ${{ runner.temp }}

      - name: Load and push
        run: |
          docker load --input ${{ runner.temp }}/texlive.tar
          docker tag ${{ env.TEST_TAG }} ghcr.io/${{ github.repository_owner }}/${{ env.LATEST_TAG }}
          docker push ghcr.io/${{ github.repository_owner }}/${{ env.LATEST_TAG }}

      # - name: Build and push
      #   uses: docker/build-push-action@v7
      #   with:
      #     context: ./texlive
      #     file: ./texlive/Dockerfile
      #     push: true
      #     tags: ghcr.io/${{ github.repository_owner }}/${{ env.LATEST_TAG }}
